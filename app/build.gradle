plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' version "2.0.20-1.0.24"// Use KSP instead of kapt
    id 'com.google.dagger.hilt.android'
    id 'androidx.navigation.safeargs'
    id 'org.jetbrains.kotlin.plugin.compose' version "2.0.0"
}

android {
    compileSdk 35

    defaultConfig {
        namespace "com.example.jetcompose"
        applicationId "com.demo.jetcompose"
        minSdk 21
        targetSdk 35
        versionCode 19
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    kotlinOptions {
        freeCompilerArgs = ['-Xjvm-default=all']
    }
    kotlin {
        sourceSets.all {
            languageSettings.enableLanguageFeature("ExplicitBackingFields")
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation files('libs/YouTubeAndroidPlayerApi.jar')

    def nav_version = "2.8.8"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'

    implementation libs.bundles.compose

    implementation libs.bundles.play.core
    implementation libs.bundles.retrofit
    implementation libs.palette
    implementation libs.datastore
    implementation libs.constraintlayout
    implementation libs.bundles.coil

    androidTestImplementation libs.compose.test
    debugImplementation libs.compose.tooling.ui
}


